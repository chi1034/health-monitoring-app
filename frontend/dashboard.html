<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Health Monitoring App</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body onload="checkAuth()">
  <h1>Health Dashboard</h1>
  <button onclick="logout()">Logout</button>

  <div class="form-container">
    <label>Blood Sugar (mg/dL):</label>
    <input type="number" id="bloodSugar" placeholder="Enter blood sugar">

    <label>Blood Pressure (mmHg):</label>
    <input type="number" id="bloodPressure" placeholder="Enter blood pressure">

    <button onclick="addReading()">Add Reading</button>
  </div>

  <canvas id="healthChart" width="400" height="200"></canvas>

  <script src="dashboard.js"></script>
</body>
</html>
